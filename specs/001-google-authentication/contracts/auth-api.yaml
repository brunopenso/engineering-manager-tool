openapi: 3.0.3
info:
  title: Engineering Manager Tool Auth API
  version: 0.1.0
  description: Contracts for Google-only authentication and authenticated user session checks.
servers:
  - url: http://localhost:3001
paths:
  /auth/google/login:
    post:
      summary: Authenticate user with Google ID token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken:
                  type: string
                  description: Google ID token received from frontend Google sign-in flow.
      responses:
        '200':
          description: Authentication succeeded
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, redirectPath, welcomeMessage, user]
                properties:
                  accessToken:
                    type: string
                  redirectPath:
                    type: string
                    example: /welcome
                  welcomeMessage:
                    type: string
                    example: Welcome to the system
                  user:
                    $ref: '#/components/schemas/UserProfile'
        '401':
          description: Invalid or expired Google token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/me:
    get:
      summary: Return current authenticated user
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated session is valid
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/UserProfile'
        '401':
          description: Missing or invalid application token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserProfile:
      type: object
      required: [id, email, fullName, firstLoginAt, lastLoginAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        firstLoginAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
