openapi: 3.0.3
info:
  title: Engineering Manager Tool Profile Settings API
  version: 0.1.0
  description: |
    Delta for feature 014-profile-theme-github.
    Merge UserProfile extensions and PATCH /users/me into
    specs/004-user-role-profiles/contracts/user-roles-api.yaml during implementation.
servers:
  - url: http://localhost:3001
paths:
  /users/me:
    patch:
      summary: Update own profile settings (theme and GitHub login)
      tags: [Profile]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileSettingsUpdate'
      responses:
        '200':
          description: Profile settings updated
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/UserProfile'
        '400':
          description: Validation error (invalid theme, GitHub handle, or empty body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid application token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LanguagePreference:
      type: string
      enum:
        - en-US
        - pt-BR
    DateFormatPreference:
      type: string
      enum:
        - MDY
        - DMY
        - YMD
    ThemePreference:
      type: string
      enum:
        - light
        - dark
    UserProfile:
      type: object
      required:
        - id
        - email
        - fullName
        - firstLoginAt
        - lastLoginAt
        - roles
        - themePreference
        - githubLogin
        - languagePreference
        - dateFormatPreference
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        firstLoginAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UserRoleType'
        themePreference:
          $ref: '#/components/schemas/ThemePreference'
        githubLogin:
          type: string
          nullable: true
          maxLength: 39
          description: GitHub username handle; null when unset.
        languagePreference:
          $ref: '#/components/schemas/LanguagePreference'
        dateFormatPreference:
          $ref: '#/components/schemas/DateFormatPreference'
    ProfileSettingsUpdate:
      type: object
      minProperties: 1
      properties:
        themePreference:
          $ref: '#/components/schemas/ThemePreference'
        githubLogin:
          type: string
          nullable: true
          maxLength: 39
          description: Trimmed; empty string clears to null.
        languagePreference:
          $ref: '#/components/schemas/LanguagePreference'
        dateFormatPreference:
          $ref: '#/components/schemas/DateFormatPreference'
    UserRoleType:
      type: string
      enum:
        - COLLABORATOR
        - LEADER
        - ADMINISTRATOR
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - MISSING_APP_TOKEN
            - INVALID_APP_TOKEN
        message:
          type: string
