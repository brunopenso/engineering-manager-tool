openapi: 3.0.3
info:
  title: Engineering Manager Tool User Roles API
  version: 0.1.0
  description: Contracts for multi-role user profiles, session role exposure, and administrator role management.
servers:
  - url: http://localhost:3001
paths:
  /auth/google/login:
    post:
      summary: Authenticate user with Google ID token (roles included in user profile)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken:
                  type: string
      responses:
        '200':
          description: Authentication succeeded
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, redirectPath, welcomeMessage, user]
                properties:
                  accessToken:
                    type: string
                  redirectPath:
                    type: string
                  welcomeMessage:
                    type: string
                  user:
                    $ref: '#/components/schemas/UserProfile'
  /auth/me:
    get:
      summary: Return current authenticated user with active roles
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated session is valid
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/UserProfile'
        '401':
          description: Missing or invalid application token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users:
    get:
      summary: List users with role profiles (administrator only, filterable)
      description: |
        Returns organization users matching optional filters. Name and email use
        case-insensitive substring match after trim. Roles use OR when multiple
        values are supplied. Dimensions combine with AND.
      tags: [User Administration]
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: When provided (non-empty after trim), filter by display name substring.
        - name: email
          in: query
          required: false
          schema:
            type: string
          description: When provided (non-empty after trim), filter by email substring.
        - name: roles
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/UserRoleType'
          style: form
          explode: true
          description: When provided, return users with at least one listed role (OR).
      responses:
        '200':
          description: User directory for administration
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserProfile'
        '400':
          description: Invalid role filter value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller lacks administrator role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid application token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/{userId}:
    get:
      summary: Get a user profile with roles (administrator only)
      tags: [User Administration]
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Target user profile
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/UserProfile'
        '403':
          description: Caller lacks administrator role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/me:
    patch:
      summary: Update own profile settings (theme and GitHub login)
      tags: [Profile]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileSettingsUpdate'
      responses:
        '200':
          description: Profile settings updated
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/UserProfile'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid application token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/{userId}/roles:
    patch:
      summary: Grant or revoke leader or administrator role (administrator only)
      tags: [User Administration]
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleChangeRequest'
      responses:
        '200':
          description: Role change applied or was already in desired state
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/UserProfile'
        '400':
          description: Invalid role or action (for example collaborator change attempt)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller lacks administrator role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Target user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserRoleType:
      type: string
      enum:
        - COLLABORATOR
        - LEADER
        - ADMINISTRATOR
    ThemePreference:
      type: string
      enum:
        - light
        - dark
    UserProfile:
      type: object
      required:
        - id
        - email
        - fullName
        - firstLoginAt
        - lastLoginAt
        - roles
        - themePreference
        - githubLogin
        - leader
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        firstLoginAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UserRoleType'
          description: Active roles; always includes COLLABORATOR.
        themePreference:
          $ref: '#/components/schemas/ThemePreference'
        githubLogin:
          type: string
          nullable: true
          maxLength: 39
        leader:
          allOf:
            - $ref: '#/components/schemas/LeaderSummary'
          nullable: true
          description: Assigned leader public identity, or null when unassigned.
    LeaderSummary:
      type: object
      required:
        - id
        - fullName
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
    ProfileSettingsUpdate:
      type: object
      minProperties: 1
      properties:
        themePreference:
          $ref: '#/components/schemas/ThemePreference'
        githubLogin:
          type: string
          nullable: true
          maxLength: 39
    RoleChangeRequest:
      type: object
      required: [role, action]
      properties:
        role:
          type: string
          enum:
            - LEADER
            - ADMINISTRATOR
        action:
          type: string
          enum:
            - GRANT
            - REVOKE
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - INVALID_TOKEN
            - EXPIRED_TOKEN
            - ISSUER_MISMATCH
            - AUDIENCE_MISMATCH
            - MISSING_APP_TOKEN
            - INVALID_APP_TOKEN
            - FORBIDDEN
            - NOT_FOUND
            - VALIDATION_ERROR
        message:
          type: string
