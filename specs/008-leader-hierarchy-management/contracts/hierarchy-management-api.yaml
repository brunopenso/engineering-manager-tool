openapi: 3.0.3
info:
  title: Engineering Manager Tool Hierarchy Management API
  version: 0.1.0
  description: Leader-only orphan-user search and assignment workflow.
servers:
  - url: http://localhost:3001
paths:
  /users/orphans:
    get:
      summary: Search orphan users (leader only)
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: query
          required: false
          schema:
            type: string
          description: Case-insensitive partial or full match against user name or email.
      responses:
        '200':
          description: Matching orphan users
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrphanUserSummary'
        '401':
          description: Missing or invalid authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated actor is not a leader
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/{userId}/assign-leader:
    post:
      summary: Assign logged-in leader as user leader (leader only)
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User assigned to authenticated leader
          content:
            application/json:
              schema:
                type: object
                required: [userId, leaderId, updatedAt]
                properties:
                  userId:
                    type: string
                    format: uuid
                  leaderId:
                    type: string
                    format: uuid
                  updatedAt:
                    type: string
                    format: date-time
        '400':
          description: Invalid input or user no longer eligible for orphan assignment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated actor is not a leader
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    OrphanUserSummary:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
