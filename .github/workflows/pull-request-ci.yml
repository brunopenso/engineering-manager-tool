name: Pull Request CI

on:
  pull_request:
    branches:
      - *
    paths-ignore:
      - '**/*.md'
      - '**/*.markdown'

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Install, lint, and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test
